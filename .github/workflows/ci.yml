name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Export requirements
        run: uv export --no-dev --no-hashes -o requirements.txt

      - name: Ensure requirements.txt is up to date
        run: |
          git diff --exit-code requirements.txt || (echo "requirements.txt is not up to date. Please run 'uv export --no-dev --no-hashes -o requirements.txt' and commit the changes." && exit 1)
