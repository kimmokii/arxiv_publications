name: Update arXiv PDF

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-pdf:
    if: vars.ENABLE_ARXIV_WORKFLOW == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate PDF
        run: python make_arxiv_pdf.py --author "Kimmo Kiiveri" --out kiiveri_arxiv_bibliography.pdf

      - name: Commit if latest entry changed
        if: vars.AUTO_COMMIT_PDF == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet .arxiv_cache; then
            git add kiiveri_arxiv_bibliography.pdf .arxiv_cache
            git commit -m "chore: update arXiv bibliography PDF"
            git push
          else
            echo "No changes in latest entry"
          fi
