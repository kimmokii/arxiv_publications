[project]
name = "arxiv-publications"
version = "0.1.0"
description = """Fetches an author's publications from arXiv using multiple name variations,
sorts them by year, and creates a clean numbered PDF bibliography."""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pyright>=1.1.200",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "semgrep>=1.45.0",
]